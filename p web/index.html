<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index</title>
    <style>
      :root {
        --bg: #f5f3ff;
        --card: #ffffff;
        --primary: #6d28d9;
        --primary-dark: #4c1d95;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #f5f3ff 0%, #eef2ff 100%);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .card {
        width: min(90vw, 540px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(109, 40, 217, 0.12);
        padding: 40px 32px;
        text-align: center;
      }

      .badge {
        display: inline-block;
        background: rgba(109, 40, 217, 0.1);
        color: var(--primary);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1 {
        margin: 20px 0 12px;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.1;
      }

      p {
        margin: 0 auto 24px;
        max-width: 420px;
        color: var(--muted);
        line-height: 1.6;
      }

      .button {
        display: inline-block;
        background: var(--primary);
        color: white;
        text-decoration: none;
        padding: 14px 24px;
        border-radius: 12px;
        font-weight: 700;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      .button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">Welcome</span>
      <h1>Hello, world!</h1>
      <p>
        This is a simple HTML landing page created in a single file with clean styling.
      </p>
      <a href="#" class="button">Get started</a>
    </main>
  </body>
</html>
